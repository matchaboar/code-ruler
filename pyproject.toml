[project]
name = "code-ruler"
version = "0.1.0"
description = "Learn coding rules from GitHub PR reviews and enforce them as a linter"
readme = "README.md"
authors = [{ name = "matchaboar", email = "matchaboar@email.com" }]
requires-python = "==3.11.*"
dependencies = [
    "PyGithub>=2.1.1,<3",
    "SQLAlchemy>=2.0.0,<3",
    "anthropic[bedrock]>=0.39.0,<1",
    "pydantic>=2.0.0,<3",
    "fastapi>=0.109.0,<1",
    "uvicorn>=0.25.0,<1",
    "ddtrace>=2.0.0,<3",
    "python-dotenv>=1.0.1",
]

[project.scripts]
github-extractor = "github_extractor.cli:main"
code-ruler = "code_ruler.main:main"
rule-marker = "rule_marker.main:main"
rule-viewer = "rule_viewer.main:app_cli"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "ruff>=0.9.0",
    "pytest>=7.4,<9",
    "httpx>=0.25.0,<1",
]
